defaults: ../default.yaml
dataset:
  # Pools the original folders and creates NEW 70/15/15 partitions.
  # This protocol is not comparable directly to the official BRISC test split.
  roots:
    - /content/dataset/train
    - /content/dataset/test
  classes: [glioma, meningioma, no_tumor, pituitary]
training:
  early_stopping:
    enabled: true
    patience: 4
    min_delta: 0.001
    min_epochs: 5
  output_dir: /content/neurosage_runs/brisc
model:
  selector:
    dropout: 0.2
  projector:
    dropout: 0.3
  graph:
    dropout: 0.3
  head:
    dropout: 0.4
